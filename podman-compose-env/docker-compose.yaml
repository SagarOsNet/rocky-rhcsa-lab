version: "3.8"

services:
  api:
    build: ../podman-demo-api 
    image: demo-api:compose
    container_name: demo-api
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7.4-alpine
    container_name: demo-redis
    volumes:
      - redis-data:/data

volumes:
  redis-data:

